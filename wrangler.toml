name = "password-manager"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages：构建产物目录
pages_build_output_dir = ".next"

[vars]
CORS_ALLOWED_ORIGINS = "*"
CORS_ALLOW_CREDENTIALS = "true"
PBKDF2_ITERATIONS = "200000"
SESSION_COOKIE_NAME = "pm_session"
SESSION_DURATION = "86400"
# KV 绑定名：唯一需要关心的 KV 配置。
# 改名时请与下方 [[kv_namespaces]] 的 binding 保持一致（重新部署会自动创建新命名空间）。
KV_MAIN_BINDING = "PASSWORD_MANAGER_KV"
RATE_LIMIT_AUTH_PER_MINUTE = "10"
RATE_LIMIT_API_PER_MINUTE = "600"

# KV 命名空间：只需填写 binding 名称。
# id 无需填写 —— `npm run cf:deploy` 会自动创建命名空间并把真实 ID 回写到这里。
# （0 占位仅为通过 wrangler 本地配置校验，首次部署时会被自动替换为真实 ID）
[[kv_namespaces]]
binding = "PASSWORD_MANAGER_KV"

